<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEOMETRY MAX</title>
<style>
 body{margin:0;overflow:hidden;background:#0a0a14;font-family:monospace;touch-action:none}
 canvas{display:block;width:100vw;height:100vh}
 #info{position:fixed;top:8px;left:8px;background:rgba(0,0,0,0.92);color:#00ff88;padding:10px;border-radius:10px;font:10px monospace;border:1px solid #00ff88;max-width:165px;z-index:10;max-height:60vh;overflow-y:auto}
 #controls{position:fixed;top:8px;right:8px;z-index:20;display:flex;flex-direction:column;gap:8px}
.btn{background:#00ff88;color:#000;border:0;padding:12px 16px;border-radius:12px;font:bold 12px monospace;box-shadow:0 4px 15px rgba(0,255,136,0.4)}
.btn:active{transform:scale(0.95)}
.btn-red{background:#ff0066;color:#fff}
 #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(0,255,136,0.15);color:#00ff88;padding:8px 16px;border-radius:20px;font:11px monospace;border:1px solid #00ff88;z-index:10}
</style>
</head>
<body>
<div id="info"></div>
<div id="controls">
 <button class="btn" onclick="addPoint()">➕ ADD POINT</button>
 <button class="btn btn-red" onclick="resetPoints()">🔄 RESET</button>
</div>
<div id="hint">👆 DRAG A-G • ADD</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight; draw();}
const colors=['#ff0066','#00ccff','#ffcc00','#aa00ff','#00ffaa','#ff8800','#ff00aa','#00ff88'];
const labels=['A','B','C','D','E','F','G','H'];
let points=[];
function init(){
 points=[];
 const cx=innerWidth/2, cy=innerHeight/2;
 for(let i=0;i<3;i++){
  const ang=i*120*Math.PI/180;
  points.push({x:cx+Math.cos(ang)*80,y:cy+Math.sin(ang)*80,color:colors[i],label:labels[i]});
 }
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function polygonArea(pts){
 let area=0; for(let i=0;i<pts.length;i++){ let j=(i+1)%pts.length; area+=pts[i].x*pts[j].y-pts[j].x*pts[i].y; } return Math.abs(area)/2;
}
function addPoint(){
 if(points.length>=7){alert('MAX G NA GHI! 7 POINTS NA!'); return;}
 const cx=innerWidth/2, cy=innerHeight/2;
 const ang=Math.random()*360*Math.PI/180;
 const r=70+Math.random()*50;
 points.push({x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r,color:colors[points.length],label:labels[points.length]});
 draw();
}
function resetPoints(){init(); draw();}
let drag=null;
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
 for(let i=0;i<canvas.width;i+=30){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke()}
 for(let i=0;i<canvas.height;i+=30){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(canvas.width,i);ctx.stroke()}
 if(points.length>2){
  ctx.fillStyle='rgba(0,255,136,0.12)'; ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y);
  points.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,255,136,0.6)'; ctx.lineWidth=2; ctx.stroke();
 }
 // sides
 for(let i=0;i<points.length;i++){
  const p1=points[i], p2=points[(i+1)%points.length];
  if(points.length>2 || i==0){
   ctx.strokeStyle='#00ff88'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
   const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
   if(dist(p1,p2)>30){
    ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(mx-20,my-10,40,12);
    ctx.fillStyle='#00ff88'; ctx.font='bold 9px monospace'; ctx.textAlign='center'; ctx.fillText(dist(p1,p2).toFixed(0),mx,my-2);
   }
  }
 }
 points.forEach(p=>{
  ctx.shadowColor=p.color; ctx.shadowBlur=20;
  ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,20,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(p.x,p.y,16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 13px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.label,p.x,p.y);
 });
 // info
 let per=0; for(let i=0;i<points.length;i++) per+=dist(points[i],points[(i+1)%points.length]);
 let area=points.length>2?polygonArea(points):0;
 let html=`<b>📐 ${points.length} POINTS</b><br><br>`;
 points.forEach(p=>{html+=`<span style="color:${p.color}">● ${p.label}</span> (${p.x|0},${p.y|0})<br>`});
 html+=`<br>Perimeter ${per.toFixed(0)}<br>`;
 if(area>0) html+=`Area ${area.toFixed(0)}<br>`;
 html+=`Sides ${points.length}<br>`;
 if(points.length==3) html+=`<br>Triangle 🔺<br>Sum 180°`;
 else if(points.length==4) html+=`<br>Quadrilateral ◼️<br>Sum 360°`;
 else if(points.length>4) html+=`<br>${points.length}-gon ⬡<br>Sum ${(points.length-2)*180}°`;
 document.getElementById('info').innerHTML=html;
}
function getPos(e){const t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY};}
canvas.addEventListener('mousedown',e=>{const m=getPos(e); points.forEach(p=>{if(dist(m,p)<35) drag=p;});});
canvas.addEventListener('touchstart',e=>{const m=getPos(e); points.forEach(p=>{if(dist(m,p)<45) drag=p;});},{passive:false});
canvas.addEventListener('mousemove',e=>{if(drag){const m=getPos(e); drag.x=m.x; drag.y=m.y; draw();}});
canvas.addEventListener('touchmove',e=>{if(drag){e.preventDefault(); const m=getPos(e); drag.x=m.x; drag.y=m.y; draw();}},{passive:false});
canvas.addEventListener('mouseup',()=>drag=null);
canvas.addEventListener('touchend',()=>drag=null);
addEventListener('resize',resize);
init(); resize();
</script>
</body>
</html>
