<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#fff;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;overflow:hidden;position:relative}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1}
.card{border:1px solid #222;background:rgba(16,16,20,0.9);backdrop-filter:blur(10px);padding:40px 28px;border-radius:24px;text-align:center;width:100%;max-width:420px;z-index:2}
.dot{width:8px;height:8px;background:#0f8;border-radius:50%;display:inline-block;box-shadow:0 0 10px #0f8;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
h1{font-size:34px;margin:16px 0 12px}h1 span{color:#a29bfe}
p{color:#888;font-size:12px;line-height:1.6;margin-bottom:22px}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
a{color:#fff;text-decoration:none;background:#1e1e22;border:1px solid #2a2a2e;padding:10px 18px;border-radius:10px;font-size:11px;transition:0.2s}
a:hover{background:#fff;color:#000;transform:translateY(-2px)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="card">
<div style="background:#111;border:1px solid #222;padding:6px 12px;border-radius:100px;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#888"><div class="dot"></div> LIVE</div>

<script>
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth;canvas.height=innerHeight;
let s=[];
for(let i=0;i<120;i++){s.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.2,v:Math.random()*0.4+0.2})}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#fff';
s.forEach(o=>{
ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
o.y+=o.v;if(o.y>canvas.height){o.y=0;o.x=Math.random()*canvas.width}
});
requestAnimationFrame(draw);
}
draw();
</script>
</body>
